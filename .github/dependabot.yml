# Automated dependency updates. Every PR runs full CI (tests, scans, e2e),
# so upgrades are small, frequent and verified instead of big and scary.
version: 2
updates:
  - package-ecosystem: github-actions   # also bumps SHA-pinned actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/infra/aws", "/infra/gcp"]
    schedule: { interval: monthly }
