# Continuous Integration: runs on every pull request and push.
# Nothing merges unless ALL of these pass (make them required checks in
# branch protection).
#
# SECURITY: third-party actions are referenced by version tag for
# readability. In your fork, pin every `uses:` to a full commit SHA
# (e.g. with `pinact run`) — see docs/SECURITY.md for why (Trivy, March 2026).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  KUSTOMIZE_VERSION: "5.7.1"

jobs:
  quality:
    name: lint + security (code & deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]" uv pyyaml
      - name: Ruff (lint + security rules)
        run: ruff check src tests scripts locustfile.py
      - name: Bandit (Python security linter)
        run: bandit -q -r src -c pyproject.toml
      - name: pip-audit (known CVEs in locked dependencies)
        run: pip-audit --strict -r requirements.lock --require-hashes --disable-pip
      - name: Lockfile is up to date with pyproject.toml
        run: |
          uv pip compile pyproject.toml --extra aws --extra gcp --extra tracing --extra mlflow \
            --python-version 3.11 --python-platform x86_64-manylinux_2_28 --generate-hashes -q -o /tmp/lock
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/lock) \
            || (echo "::error::requirements.lock is stale — run 'make lock'"; exit 1)
      - name: Alert rules in sync with Kubernetes PrometheusRule
        run: python scripts/sync_alerts.py --check

  test:
    name: tests (unit, model, API, registry, k8s policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev,aws,mlflow]" pyyaml
      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize
      - run: pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: test-reports, path: reports/ }

  iac:
    name: infrastructure-as-code checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: terraform fmt + validate (both clouds)
        run: |
          for c in aws gcp; do
            terraform -chdir=infra/$c fmt -check -recursive
            terraform -chdir=infra/$c init -backend=false -input=false
            terraform -chdir=infra/$c validate
          done
      - name: Install kustomize + kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Render every overlay and validate against Kubernetes + CRD schemas
        run: |
          mkdir -p rendered
          for o in k8s/overlays/* k8s/platform/aws k8s/platform/gcp; do
            name=$(echo "$o" | tr '/' '-')
            kustomize build "$o" > "rendered/$name.yaml"
            kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "rendered/$name.yaml"
          done
      - name: Checkov (Terraform, Kubernetes, Dockerfile, workflows)
        run: |
          pip install checkov
          checkov -d infra --framework terraform --quiet --compact
          checkov -d rendered --framework kubernetes --quiet --compact --config-file .checkov-k8s.yaml
          checkov -f Dockerfile --framework dockerfile --quiet --compact
          checkov -d .github/workflows --framework github_actions --quiet --compact
      - name: Hadolint (Dockerfile best practices)
        uses: hadolint/hadolint-action@v3.5.0
        with: { dockerfile: Dockerfile }

  images:
    name: build + scan images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build serve + train images
        run: |
          docker buildx build --target serve -t churn-api:ci --load .
          docker buildx build --target train -t churn-train:ci --load .
      - name: Trivy — fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0     # >= 0.35.0: see CVE-2026-33634
        with:
          image-ref: churn-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: end-to-end (compose stack + smoke + load test)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Start stack (MinIO -> seed -> train -> API)
        run: docker compose up -d --build --wait api
      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000 dev-key
      - name: Load test against the SLO (p95 < 250ms, errors < 0.5%)
        run: |
          pip install locust
          mkdir -p reports
          LOAD_API_KEY=dev-key locust -f locustfile.py --host http://localhost:8000 \
            --headless -u 20 -r 5 -t 60s --csv reports/load --only-summary
          python scripts/check_slo.py reports/load_stats.csv
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - run: docker compose down -v
        if: always()
