mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
serviceAccount:
  name: otel-collector          # Workload Identity grants Cloud Trace agent (infra/gcp/iam.tf)
config:
  receivers:
    otlp:
      protocols:
        http: { endpoint: 0.0.0.0:4318 }
  processors:
    batch: {}
  exporters:
    googlecloud: {}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [googlecloud]
