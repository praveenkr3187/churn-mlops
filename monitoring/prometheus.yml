# Local Prometheus (docker-compose). In Kubernetes the Prometheus Operator
# discovers the API through k8s/base/servicemonitor.yaml instead.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
