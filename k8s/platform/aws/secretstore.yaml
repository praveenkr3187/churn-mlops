# External Secrets Operator reads AWS Secrets Manager using its own EKS Pod
# Identity (infra/aws/iam.tf grants it read on the churn-api secret only).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cloud-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
