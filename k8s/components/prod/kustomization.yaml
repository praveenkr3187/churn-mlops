# Production hardening shared by aws-prod and gcp-prod.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target: { kind: HorizontalPodAutoscaler, name: churn-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3          # one per zone, survives a zone outage
      - op: replace
        path: /spec/maxReplicas
        value: 20
  - target: { kind: Deployment, name: churn-api-canary }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { memory: 1Gi }
  - target: { kind: Deployment, name: churn-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 500m, memory: 512Mi }
          limits: { memory: 1Gi }
