# The "stable" track of the API. The canary track (components/canary) is a
# copy with track=canary; the HTTPRoute splits traffic between them by weight.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  labels:
    app.kubernetes.io/name: churn-api
    app.kubernetes.io/component: api
    track: stable
spec:
  replicas: 2                      # HPA takes over after first apply
  revisionHistoryLimit: 5          # enables `kubectl rollout undo`
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0            # never drop below desired capacity during a deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: churn-api
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: churn-api
        app.kubernetes.io/component: api
        track: stable
    spec:
      serviceAccountName: churn-api
      automountServiceAccountToken: false   # the app never talks to the k8s API
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:             # survive a zone outage
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: churn-api
              track: stable
      containers:
        - name: api
          image: churn-api                   # replaced by `images:` in each overlay
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: churn-config           # env-wide settings
            - configMapRef:
                name: churn-stable-release   # CHURN_MODEL_VERSION for this track
            - secretRef:
                name: churn-api-secrets      # API keys + PII salt (from cloud secret manager)
          env:
            - name: CHURN_TRACK
              value: stable
            - name: OTEL_SERVICE_NAME
              value: churn-api
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi                  # no CPU limit: avoids throttling; requests drive scheduling/HPA
          startupProbe:                      # model download may take a while on cold start
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 24             # up to 2 minutes
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:                         # let the gateway stop routing before we exit
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
