# Separate identities = least privilege:
#   churn-api      READ models bucket only
#   churn-trainer  READ data bucket, WRITE models bucket
#   churn-batch    READ models + data, WRITE scores
# The cloud IAM bindings live in infra/aws (EKS Pod Identity) and
# infra/gcp (Workload Identity Federation). No keys are ever stored.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: churn-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: churn-trainer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: churn-batch
automountServiceAccountToken: false
