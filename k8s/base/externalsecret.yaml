# Secrets never live in Git. External Secrets Operator copies them from the
# cloud secret manager (AWS Secrets Manager / GCP Secret Manager) into a
# Kubernetes Secret and refreshes them hourly (key rotation without redeploys
# of this manifest — pods pick up rotated keys on their next restart).
#
# The cloud secret holds JSON:
#   {"api_keys": "k1,k2", "admin_api_keys": "a1", "pii_salt": "<random 32 bytes>"}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: churn-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secrets          # defined per cloud in components/aws|gcp
  target:
    name: churn-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: CHURN_API_KEYS
      remoteRef: { key: churn-api, property: api_keys }
    - secretKey: CHURN_ADMIN_API_KEYS
      remoteRef: { key: churn-api, property: admin_api_keys }
    - secretKey: CHURN_PII_SALT
      remoteRef: { key: churn-api, property: pii_salt }
