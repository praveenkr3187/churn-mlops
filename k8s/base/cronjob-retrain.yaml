# Scheduled retraining. The job trains on the latest data, runs every gate,
# and registers the model under the 'staging' alias. It NEVER touches
# production: a human approves promotion in the model-release workflow.
# Gate failure -> non-zero exit -> Job fails -> ChurnRetrainJobFailed alert.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: churn-retrain
  labels:
    app.kubernetes.io/name: churn-retrain
    app.kubernetes.io/component: job
spec:
  schedule: "30 20 * * 0"          # Sundays 20:30 UTC (Monday 02:00 IST)
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: churn-retrain
            app.kubernetes.io/component: job
        spec:
          serviceAccountName: churn-trainer
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: train
              image: churn-train
              args: ["--alias", "staging"]
              envFrom:
                - configMapRef: { name: churn-config }
              resources:
                requests: { cpu: "1", memory: 2Gi }
                limits: { memory: 4Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
