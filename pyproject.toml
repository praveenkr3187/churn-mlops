[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "2.0.0"
description = "Production ML deployment reference: customer churn prediction"
requires-python = ">=3.11"
# Loose ranges here; EXACT pins (with hashes) live in requirements.lock,
# which is what Docker images install. Regenerate with `make lock`.
dependencies = [
    "scikit-learn>=1.9.1,<1.10",
    "pandas>=3.0.6",
    "numpy>=2.4.6",
    "joblib>=1.6.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "prometheus-client>=0.26.0",
    "fsspec>=2026.9.0",
]

[project.optional-dependencies]
aws = ["s3fs>=2026.9.0"]          # s3:// registry + data (also MinIO)
gcp = ["gcsfs>=2026.10.0"]         # gs:// registry + data
mlflow = ["mlflow-skinny>=3.16.1,<4"]   # optional experiment tracking (src/churn/tracking.py)
tracing = [
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.10",
    "moto[server]>=5.2.3",
    "boto3>=1.43.108",
    "s3fs>=2026.9.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "locust>=2.46.7",
    "pyyaml>=6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008", "S311"]   # asserts in tests, FastAPI Depends defaults, non-crypto RNG

[tool.ruff.lint.isort]
known-first-party = ["churn", "generate_data"]   # generate_data: sibling module imported by scripts/

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]
"locustfile.py" = ["S"]

[tool.bandit]
exclude_dirs = ["tests"]
