[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "2.0.0"
description = "Production ML deployment reference: customer churn prediction"
requires-python = ">=3.11"
# Loose ranges here; EXACT pins (with hashes) live in requirements.lock,
# which is what Docker images install. Regenerate with `make lock`.
dependencies = [
    "scikit-learn>=1.5,<1.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "prometheus-client>=0.20",
    "fsspec>=2024.2",
]

[project.optional-dependencies]
aws = ["s3fs>=2024.2"]          # s3:// registry + data (also MinIO)
gcp = ["gcsfs>=2024.2"]         # gs:// registry + data
mlflow = ["mlflow-skinny>=2.16,<3"]   # optional experiment tracking (src/churn/tracking.py)
tracing = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "moto[server]>=5",
    "boto3>=1.34",
    "s3fs>=2024.2",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "locust>=2.29",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008", "S311"]   # asserts in tests, FastAPI Depends defaults, non-crypto RNG

[tool.ruff.lint.isort]
known-first-party = ["churn", "generate_data"]   # generate_data: sibling module imported by scripts/

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]
"locustfile.py" = ["S"]

[tool.bandit]
exclude_dirs = ["tests"]
